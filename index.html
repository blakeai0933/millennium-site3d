<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Millennium Site Viewer</title>
<link rel="preconnect" href="https://tile.googleapis.com">
<link rel="preconnect" href="https://atlas.microsoft.com">
<link rel="preconnect" href="https://maps.googleapis.com">
<style>
:root{--bg:#0e151b;--panel:#16212a;--panel2:#1c2933;--ink:#e8eef3;--muted:#9fb0bf;--line:#35444f;--steel:#2f6f9f;--hot:#e0312b;--ok:#2e9e6a;--amber:#f2b01e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow:hidden}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
header{display:flex;align-items:center;gap:10px;padding:8px max(14px,env(safe-area-inset-right)) 6px max(14px,env(safe-area-inset-left));padding-top:calc(8px + env(safe-area-inset-top));background:var(--panel);min-width:0}
header .t{min-width:0;flex:1}
header b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .t span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header b{letter-spacing:-.01em}
.brand{display:flex;align-items:center;gap:8px;flex:0 0 auto;color:var(--muted);font-size:11px;line-height:1.15;text-align:left}
.brand i{display:grid;place-items:center;width:28px;height:28px;border-radius:6px;background:var(--steel);color:#fff;font:700 15px/1 system-ui,sans-serif;font-style:normal}
.brand span{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:10px;color:var(--ink)}.brand em{font-style:normal;font-weight:500;letter-spacing:.02em;text-transform:none;color:var(--muted);font-size:11px}
nav{display:flex;gap:2px;padding:0 max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left));background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
nav button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:600;padding:8px 12px 9px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;touch-action:manipulation}
nav button.on{color:var(--ink);border-bottom-color:var(--amber)}
main{position:relative;min-height:0;min-width:0}
.pane{position:absolute;inset:0}
#cz .cesium-viewer,#cz .cesium-widget{position:absolute;inset:0}
.cesium-viewer-bottom{left:auto!important;right:6px;bottom:4px!important}
#info{position:absolute;left:max(12px,env(safe-area-inset-left));top:12px;max-width:min(360px,calc(100% - 24px));background:rgba(14,21,27,.88);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;display:grid;gap:4px;z-index:3}
#info .dim,.dim{color:var(--muted)}
.flag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:1px 6px;margin-right:6px;color:#fff;background:var(--ok)}
.flag.red{background:var(--hot)}.flag.amb{background:var(--amber);color:#111}
#msg,.msg{overflow-wrap:anywhere;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.72);padding:12px 16px;border-radius:8px;max-width:min(440px,calc(100% - 32px));z-index:4}
@media (max-width:760px){.fld input,.fld select,.srch input,#rStart{font-size:16px}.brand{display:none}}
#msg input{width:100%;margin:8px 0;padding:8px;border-radius:6px;border:1px solid var(--line);background:#0b1116;color:var(--ink);font-size:16px}
#meas{position:absolute;right:max(12px,env(safe-area-inset-right));top:12px;background:rgba(14,21,27,.88);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;z-index:3;max-width:260px}
footer{display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:10px;align-items:center;padding:8px max(14px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));background:var(--panel);border-top:1px solid var(--line)}
footer>*{flex:0 0 auto}footer .sep{width:1px;height:22px;background:var(--line)}footer .lab{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button,.btn{border:0;background:transparent;color:#dbe4ea;font:inherit;font-size:12px;padding:7px 10px;cursor:pointer;touch-action:manipulation}
.seg button.on{background:var(--steel);color:#fff}
.btn{border:1px solid var(--line);border-radius:6px}
.btn.on,.btn.pri{background:var(--amber);color:#111;border-color:var(--amber);font-weight:600}
label.ck{display:flex;align-items:center;gap:5px;font-size:12px;color:#dbe4ea}
/* Azure Maps tabs: map plus a side panel (bottom sheet on phones) */
#tools,#flyp{display:grid;grid-template-columns:minmax(0,1fr) 360px}
#flym{position:relative;min-width:0;min-height:0}#flym gmp-map-3d{position:absolute;inset:0;width:100%;height:100%}
#am{position:relative;min-width:0;min-height:0}
#side,#flyside{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;overscroll-behavior:contain;padding:12px 14px calc(14px + env(safe-area-inset-bottom));font-size:13px;min-width:0}
#side h3,#flyside h3{margin:2px 0 8px;font-size:14px}
#side h4,#flyside h4{margin:14px 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fld{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 8px;align-items:center}
.fld label{font-size:12px;color:var(--muted)}
.fld input,.fld select,.srch input,#rStart{width:100%;min-width:0;height:34px;padding:0 9px;border-radius:6px;border:1px solid var(--line);background:#0b1116;color:var(--ink);font:inherit;font-size:14px}
.fld.one{grid-template-columns:minmax(0,1fr);gap:4px}
.srch{display:flex;gap:6px;margin-top:8px}.srch .btn{height:34px}
details.truck{margin:12px 0 4px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--panel2)}
details.truck summary{list-style:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 0;cursor:pointer;font-size:12px}
details.truck summary::-webkit-details-marker{display:none}
details.truck summary span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
details.truck summary b{font-weight:600;line-height:1.35}
details.truck summary em{font-style:normal;color:#9fd0ff;font-size:12px}
details.truck[open] summary em{visibility:hidden}
details.truck[open]{padding-bottom:10px}
.btn.wide{width:100%;height:38px;margin-top:10px;font-size:13px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;margin:6px 0}
.kv b{font-variant-numeric:tabular-nums}
.big{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
td,th{padding:4px 4px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:600}
tr.gust td{color:#ffd166}tr.high td{color:#ff8a80;font-weight:600}
ol.steps{margin:6px 0 0;padding-left:20px;font-size:12px}ol.steps li{margin:3px 0}
.alert{border:1px solid var(--hot);background:rgba(224,49,43,.12);border-radius:6px;padding:8px;margin:6px 0}
.note{font-size:11px;color:var(--muted);margin-top:10px}
.sugg{display:grid;gap:2px;margin-top:4px}.sugg button{text-align:left;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:6px;padding:6px 8px;font:inherit;font-size:12px;cursor:pointer}
.legend{position:absolute;left:10px;bottom:28px;background:rgba(14,21,27,.88);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:11px;z-index:2}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;margin:0 4px 1px 8px;vertical-align:middle}
[hidden]{display:none!important}
@media (max-width:760px){
  #tools,#flyp{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,48%)}
  #side,#flyside{border-left:0;border-top:1px solid var(--line)}
  #info{font-size:11px;padding:6px 8px}#info .note{display:none}#meas{top:auto;bottom:12px;right:auto;left:12px;max-width:calc(100% - 90px)}
}
@media (max-width:760px){footer{flex-wrap:wrap;overflow:visible;gap:6px 12px}footer .lab,footer .sep{display:none}#views,#reach{flex:1 1 100%}#views button,#reach button{flex:1}#measBtn{margin-left:auto}}
</style>
</head>
<body>
<div id="app">
  <header><div class="t"><b id="title">Jobsite</b><span id="sub"></span></div><div class="brand" aria-hidden="true"><i>M</i><span>Millennium<br><em>Site Viewer</em></span></div></header>
  <nav id="tabs" aria-label="Views">
    <button data-t="3d">3D city</button><button data-t="fly">Flyover</button><button data-t="sat">Satellite</button><button data-t="route">Truck route</button><button data-t="traffic">Traffic</button><button data-t="wx">Weather</button>
  </nav>
  <main>
    <div class="pane" id="cz" hidden><div id="info" hidden></div><div id="meas" hidden></div><div id="msg" hidden>Loading 3D city…</div></div>
    <div class="pane" id="flyp" hidden><div id="flym"><div class="msg" id="fmsg" hidden></div></div><aside id="flyside"></aside></div>
    <div class="pane" id="tools" hidden><div id="am"><div class="msg" id="amsg" hidden></div></div><aside id="side"></aside></div>
  </main>
  <footer id="foot3d" hidden>
    <span class="lab">View</span><div class="seg" id="views"><button data-v="orbit" class="on">Orbit</button><button data-v="fly">Fly in</button><button data-v="top">Top</button><button data-v="street">Street</button><button data-v="free" hidden>Free</button></div>
    <span class="sep"></span><span class="lab">Crane reach</span><div class="seg" id="reach"><button data-r="100">100 ft</button><button data-r="150">150 ft</button><button data-r="200">200 ft</button><button data-r="250">250 ft</button></div>
    <span class="sep"></span><label class="ck"><input type="checkbox" id="ckPw" checked> Power lines</label>
    <label class="ck"><input type="checkbox" id="ckReach" checked> Reach ring</label>
    <label class="ck"><input type="checkbox" id="ckUg"> Underground</label>
    <button class="btn" id="measBtn" type="button">Measure</button>
  </footer>
</div>
<script src="config.js"></script>
<script src="key.js"></script>
<script src="nav3d.js"></script>
<script src="site3d.js"></script>
<script src="flyover.js"></script>
<script src="tools.js"></script>
</body>
</html>
