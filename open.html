<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Millennium Site Viewer</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0e151b;color:#e8eef3;font:15px system-ui,-apple-system,"Segoe UI",sans-serif}</style></head>
<body><p id="m">Signing in with your Millennium Microsoft account…</p>
<script>
// Public entry point. Keeps the site details from the link (#...) through the Microsoft sign-in, then opens the viewer.
// Access is by invitation: only accounts given the "millennium" role in Azure (Role management) get past this page.
(async()=>{let h=location.hash;
  try{if(h.length>1)sessionStorage.setItem('site3d-hash',h);else h=sessionStorage.getItem('site3d-hash')||''}catch(e){}
  let p=null;try{const r=await fetch('/.auth/me',{cache:'no-store'});const j=await r.json();p=j&&j.clientPrincipal}catch(e){}
  if(!p){location.replace('/.auth/login/aad?post_login_redirect_uri='+encodeURIComponent('/open.html'));return}
  if(!(p.userRoles||[]).includes('millennium')){location.replace('/denied.html');return}
  try{sessionStorage.removeItem('site3d-hash')}catch(e){}
  location.replace('/index.html'+h);
})();
</script></body></html>
