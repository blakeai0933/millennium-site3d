name: Deploy to Azure Static Web Apps
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write the map keys into config.js (kept in GitHub secrets, never in the repo)
        env:
          GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
          AZURE_MAPS_KEY: ${{ secrets.AZURE_MAPS_KEY }}
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
        run: |
          printf "window.SITE3D={googleKey:'%s',azureMapsKey:'%s',mapillaryToken:'%s'};\n" "$GOOGLE_MAPS_KEY" "$AZURE_MAPS_KEY" "$MAPILLARY_TOKEN" > config.js
      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: /
          output_location: ""
          skip_app_build: true
          skip_api_build: true
